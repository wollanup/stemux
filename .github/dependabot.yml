version: 2
updates:
  # npm packages of the web app
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor/patch bumps; majors come one by one
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Types must match the Node major we run (CI and deploy), not the latest
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore(deps)

  # Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: chore(ci)
